[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runboard-agent"
version = "0.1.0"
description = "RunBoard: per-node GPU usage collector"
requires-python = ">=3.10"
dependencies = [
  "runboard-common",
  "httpx>=0.27",
  "psutil>=5.9",
  "nvidia-ml-py>=12.535",
  "docker>=7.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
runboard-agent = "runboard_agent.main:main"

[tool.setuptools.packages.find]
include = ["runboard_agent*"]
