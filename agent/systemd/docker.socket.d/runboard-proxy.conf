# RunBoard: dockerd 의 진짜 소켓을 root 전용 자리로 옮긴다.
# 원래 자리(/run/docker.sock)는 runboard-docker-proxy.socket 이 같은 권한으로 맡는다.
# 되돌리기: sudo bash deploy/start-agent.sh --remove-docker-proxy
[Socket]
ListenStream=
ListenStream=/run/runboard-docker/docker.sock
SocketUser=root
SocketGroup=root
SocketMode=0600
DirectoryMode=0700
