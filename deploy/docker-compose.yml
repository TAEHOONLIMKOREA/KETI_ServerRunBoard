# 중앙 서버 배포.  deploy/ 에서:
#   cp runboard.example.yaml runboard.yaml   # 등록 토큰 수정 (예시의 dev 토큰은 지운다)
#   사용자·계정 매핑·공용 서비스는 DB 에 둔다. 띄운 뒤 웹 /admin 에서 등록한다
#   docker compose up -d --build
#   노드 목록·이름 변경·삭제: docker compose exec server runboard-server nodes list (rename <노드> <이름>, remove <노드>)
# HTTP 만 쓴다 (HTTPS 없음). 대시보드·API: http://<서버>:55400, 에이전트 --server 도 이 주소.
# 공유기(NAT) 뒤에서 외부 접속을 받으려면 공유기에 외부 55400 → 이 서버 55400 (TCP) 포트포워딩을 추가한다.
# DB 는 Postgres compose(프로젝트 postgres)의 postgres 컨테이너다. 그 스택을 먼저 띄워 postgres_default 네트워크가 있어야 한다.
services:
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: runboard-server:local
    restart: unless-stopped
    volumes:
      - ./runboard.yaml:/config/runboard.yaml:ro
      - ../settings.ini:/config/settings.ini:ro   # DB 접속 정보. host 는 컨테이너 이름, port 는 내부 포트
    ports:
      - "55400:8000"   # 호스트 55400 → 컨테이너 8000. 모든 인터페이스에 열린다
    networks:
      - postgres

networks:
  postgres:
    external: true
    name: postgres_default
