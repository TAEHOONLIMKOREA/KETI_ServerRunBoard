# RunBoard 서버 설정 예시. 복사해서 runboard.yaml 로 쓰고 RUNBOARD_CONFIG 로 가리키거나 --config 로 넘긴다.
# 이 파일에는 실행 설정·노드 토큰·임계값·소유자 판정 규칙만 둔다.
# 사용자·별칭, 공용 서비스는 PostgreSQL 에 두고 웹 관리 화면(/admin)에서 고친다.

server:
  # DB 접속 정보는 여기 두지 않는다. 레포 루트의 settings.ini 에서 읽는다
  persist_interval_s: 30               # 샘플을 DB 에 쓰는 간격. 에이전트 보고는 동작 중 1초·유휴 30초지만 저장은 30초
  web_dist: web/dist                   # 빌드된 프론트. 없으면 API 만 제공
  host: 0.0.0.0
  port: 8000
  display_name_prefix: Server_         # 처음 본 노드의 화면 이름 접두어 (Server_1, Server_2 …). 이름은 관리 화면 '노드' 탭에서 바꾼다
  retention:
    # 보존 기간(일). 서버가 시작할 때와 1시간마다 지난 행을 지운다. 노드·GPU 행은 지우지 않는다.
    # 값은 0 보다 크고 36500(100년) 이하다. 무한(.inf)은 받지 않으니 오래 두려면 큰 값을 적는다.
    # 환경변수 RUNBOARD_RETENTION_RAW_DAYS, RUNBOARD_RETENTION_AGG_DAYS, RUNBOARD_RETENTION_SESSIONS_DAYS 가 이 값을 덮어쓴다.
    # 지운 자리는 PostgreSQL 이 다시 쓰지만 파일 크기는 바로 줄지 않는다. 줄이려면 VACUUM FULL 을 한다
    raw_days: 7                        # 원본 샘플 (persist_interval 간격). GPU 이력 raw 조회와 5분 집계의 재료
    agg_days: 90                       # 5분 집계. 노드 상세 이력(24시간·7일)이 이것을 읽는다
    sessions_days: 365                 # 끝난 세션. 작업은 끝났고 남은 세션이 없을 때 같은 기한으로 지운다

auth:
  # 등록 토큰. 이 토큰으로 보고하는 에이전트는 이름을 미리 등록하지 않아도 참여한다 (서버 재시작 불필요).
  # 처음 본 노드는 DB nodes 표에 한 행으로 남고 Server_1, Server_2 … 이름을 받는다. 운영 전에 꼭 바꾼다
  shared_token: change-me-join-token
  node_tokens:
    # 노드별로 다른 토큰을 쓰고 싶을 때. 노드 이름 또는 node_id → 토큰. 평문 또는 'sha256:<hex>' (echo -n TOKEN | sha256sum)
    fake01: dev-token-fake01
    fake02: dev-token-fake02             # fake 노드를 여러 개 띄울 때. 이름 끝 숫자가 다르면 UUID·IP·주기가 달라진다
    fake03: dev-token-fake03
    gpu01: sha256:9b0c2a7e3f0b0d4c0e5d9d9f1f1a3f6c5b1a0e2d7c8b9a0f1e2d3c4b5a697887

thresholds:
  delayed_s: 15                        # 보고 주기(에이전트가 보고에 적음)를 넘기고 이만큼 더 지나면 '지연'. 동작 중 노드 16초, 유휴 노드 45초
  offline_s: 30                        # 보고 주기를 넘기고 이만큼 더 지나면 '끊김'. 그 노드의 작업은 '미확인'
  offline_close_after_s: 86400         # 끊긴 채 이 시간이 지나면 미확인 세션을 종료
  activity_window_s: 60                # 활동 판정 창
  activity_low_pct: 10                 # 창 안 평균 사용률이 이보다 낮으면 '낮은 활동'
  temp_warn_c: 85
  session_miss_reports: 2              # 연속 N회 보고에서 빠지면 세션 종료
  occupied_mem_pct: 70                 # 요약 색 빨강 기준
  busy_util_pct: 90
  clock_skew_max_s: 60                 # 측정·수신 시각 차이가 이보다 크면 수신 시각 사용

owner:
  container_name_rule: "^(?P<user>[A-Za-z][A-Za-z0-9]*)[_-]"   # <user>_<용도> 규칙. user 가 등록 사용자(관리 화면)일 때만
  label_owner: runboard.owner
  label_project: runboard.project
  label_job: runboard.job
