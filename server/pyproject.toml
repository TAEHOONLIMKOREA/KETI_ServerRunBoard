[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runboard-server"
version = "0.1.0"
description = "RunBoard: central GPU usage dashboard server"
requires-python = ">=3.10"
dependencies = [
  "runboard-common",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
runboard-server = "runboard_server.main:main"

[tool.setuptools.packages.find]
include = ["runboard_server*"]
